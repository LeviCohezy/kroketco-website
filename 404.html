lijks vers op tafel brengen — bij jou thuis, bij de traiteur en in de beste horecazaken.\\n\\nGeen half werk, geen kunstmatige smaakjes. Enkel eerlijke ingrediënten, met de hand gedraaid en goudbruin gebakken. Zo blijft de Belgische kroket wat ze altijd hoort te zijn: een klein stukje geluk.\"},\"over-ons.cta\":{\"title\":\"Proef het vakmanschap zelf\",\"text\":\"Vers gedraaid, goudbruin gebakken. Ontdek het volledige assortiment en breng de smaak van echt Belgisch ambacht naar je tafel.\",\"ctaLabel\":\"Bekijk het assortiment\",\"ctaHref\":\"/producten\"},\"groendaal.seo\":{\"title\":\"Groendal · Onze kaaspartner — Kroketco Belgium\",\"description\":\"Onze culinaire kaaskroketten danken hun smaak aan Groendal — authentieke Belgische kaas uit Roeselare. Ontdek het verhaal achter de samenwerking.\"},\"groendaal.hero\":{\"image\":\"/new-images/groendal-hero.png\",\"alt\":\"Groendal — authentieke Belgische kaas\"},\"groendaal.features\":{\"items\":[{\"label\":\"Klaar in een wip\"},{\"label\":\"Geworteld in traditie\"},{\"label\":\"Innovatieve smaken\"},{\"label\":\"Toegewijd aan kwaliteit\"},{\"label\":\"Premium ingrediënten\"}]},\"groendaal.cheeseScroll\":{\"kroketImage\":\"/new-images/kroket-beertje.png\",\"kroketAlt\":\"Roeselaarse kaaskroket in de vorm van een beertje\",\"before1\":\"Roeselaars\",\"before2\":\"Streekproduct\",\"after1\":\"Roeselaarse\",\"after2\":\"Kaaskroket\"},\"groendaal.about\":{\"image\":\"/new-images/groendal-sfeer.webp\",\"alt\":\"Het kaasgamma van Groendal\",\"title\":\"Authentic Belgian cheese\",\"text\":\"Groendal maakt authentieke Belgische kazen in Roeselare — bekroond voor 's werelds beste kaas. Van jong tot extra gerijpt, elk wiel met zorg en vakmanschap gemaakt, aangevuld met boter en lokale producten.\"},\"groendaal.why\":{\"eyebrow\":\"Onze samenwerking\",\"title\":\"Waarom Kroketco samenwerkt met\",\"titleAccent\":\"Groendal\",\"cards\":[{\"title\":\"Roeselaarse Roots\",\"body\":\"Groendal én Kroketco komen uit Roeselare. Zelfde t
